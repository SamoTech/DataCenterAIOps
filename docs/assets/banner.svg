<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040608"/>
      <stop offset="100%" stop-color="#080d14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0L0 0 0 28" fill="none" stroke="#0c111a" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="4" height="320" fill="url(#acc)"/>
  <!-- incident feed (right) -->
  <g opacity="0.22" transform="translate(840,44)">
    <!-- header -->
    <rect x="0" y="0" width="380" height="32" rx="6" fill="#0d1322"/>
    <text x="16" y="21" font-family="monospace" font-size="12" fill="#6b7280">Incident Feed</text>
    <circle cx="350" cy="16" r="6" fill="#ef4444" opacity="0.9"/>
    <text x="362" y="21" font-family="monospace" font-size="10" fill="#ef4444">LIVE</text>
    <!-- incident rows -->
    <rect x="0" y="38" width="380" height="38" rx="4" fill="#110a0a"/>
    <rect x="0" y="38" width="4"   height="38" rx="2" fill="#ef4444"/>
    <text x="14" y="54" font-family="monospace" font-size="11" fill="#fca5a5">CRITICAL  payments-api  latency 920ms</text>
    <text x="14" y="69" font-family="monospace" font-size="10" fill="#6b7280">Root cause: DB pool exhaustion • 2m ago</text>
    <rect x="0" y="82" width="380" height="38" rx="4" fill="#0f0f0c"/>
    <rect x="0" y="82" width="4"   height="38" rx="2" fill="#f97316"/>
    <text x="14" y="98" font-family="monospace" font-size="11" fill="#fdba74">HIGH      auth-service   error rate 8%</text>
    <text x="14" y="113" font-family="monospace" font-size="10" fill="#6b7280">Root cause: Token refresh loop • 5m ago</text>
    <rect x="0" y="126" width="380" height="38" rx="4" fill="#090d14"/>
    <rect x="0" y="126" width="4"  height="38" rx="2" fill="#eab308"/>
    <text x="14" y="142" font-family="monospace" font-size="11" fill="#fde68a">MEDIUM    storage-svc    disk 78%</text>
    <text x="14" y="157" font-family="monospace" font-size="10" fill="#6b7280">Root cause: Log rotation missed • 12m ago</text>
    <!-- risk score -->
    <rect x="0" y="172" width="380" height="52" rx="6" fill="#0c1020" stroke="#3b82f6" stroke-width="1"/>
    <text x="16" y="192" font-family="monospace" font-size="11" fill="#93c5fd">Risk Score</text>
    <rect x="16" y="200" width="240" height="10" rx="5" fill="#1a2040"/>
    <rect x="16" y="200" width="185" height="10" rx="5" fill="url(#acc)"/>
    <text x="265" y="210" font-family="Arial Black,sans-serif" font-size="14" font-weight="900" fill="#ef4444">77/100</text>
  </g>
  <!-- logo: server rack mark -->
  <g transform="translate(80,84)" filter="url(#glow)">
    <rect x="0" y="0" width="116" height="116" rx="18" fill="#040608" stroke="url(#acc)" stroke-width="3"/>
    <!-- rack units -->
    <rect x="18" y="20" width="80" height="16" rx="3" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="32" cy="28" r="3" fill="#ef4444" opacity="0.9"/>
    <rect x="18" y="44" width="80" height="16" rx="3" fill="none" stroke="#f97316" stroke-width="2"/>
    <circle cx="32" cy="52" r="3" fill="#f97316" opacity="0.9"/>
    <rect x="18" y="68" width="80" height="16" rx="3" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="32" cy="76" r="3" fill="#22c55e" opacity="0.9"/>
    <!-- AI bolt -->
    <path d="M68 65 L58 82 L66 82 L56 100 L74 78 L66 78 Z" fill="url(#acc)" opacity="0.9"/>
  </g>
  <!-- wordmark -->
  <text x="222" y="95" font-family="'SF Mono',Consolas,monospace" font-size="13" fill="#ef4444" opacity="0.6" letter-spacing="4">AIOPS CONTROL CENTER</text>
  <text x="218" y="168" font-family="Arial Black,'Arial Bold',sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="#fff5f0">DataCenter</text>
  <text x="218" y="210" font-family="Arial Black,'Arial Bold',sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="url(#acc)">AIOps</text>
  <rect x="220" y="228" width="500" height="2" fill="url(#acc)" opacity="0.45"/>
  <rect x="222" y="245" width="130" height="28" rx="14" fill="#ef4444" opacity="0.15"/>
  <text x="287" y="264" font-family="monospace" font-size="13" fill="#fca5a5" text-anchor="middle">Incidents</text>
  <rect x="364" y="245" width="130" height="28" rx="14" fill="#f97316" opacity="0.15"/>
  <text x="429" y="264" font-family="monospace" font-size="13" fill="#fdba74" text-anchor="middle">Root Cause</text>
  <rect x="506" y="245" width="130" height="28" rx="14" fill="#3b82f6" opacity="0.15"/>
  <text x="571" y="264" font-family="monospace" font-size="13" fill="#93c5fd" text-anchor="middle">Telemetry</text>
  <text x="222" y="296" font-family="monospace" font-size="12" fill="#6b7280">Logs · Metrics · Traces · Incidents · Next.js 14</text>
</svg>